<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>suma</h1>
    <script>
        let n1=Number(prompt("introduce el primer numero"));
        let n2=Number(prompt("escribe el segundo digito"));
        suma = n1 + n2;
        document.write("el valor es: " + suma + "<br>")
        

        resta = n1-n2;
        document.write("La resta es: " + resta + "<br>")

        mult= n1*n2;
        document.write("la multiplicacion: " + mult + "<br>")

        div = n1/n2;
        document.write("La division es: " + div + "<br>")
    </script>
</body>
</html>
