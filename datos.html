<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos</title>
</head>
<body>
    <h1>Datos</h1>
    <script>
        let nom=String(prompt("Escribe tu nombre"))
        let edad=Number(prompt("Escribe tu edad"))
        let esp=String(prompt("Escribe tu especialidad"))
        let direc=String(prompt("Escribe tu direccion"))

        document.write("Nombre: " + nom + "<br>")
        document.write("Edad: " + edad + "<br>")
        document.write("Especialidad: " + esp + "<br>")
        document.write("direccion: " + direc + "<br>")

    </script>
    
</body>
</html>
